name: Daily Summary and BlueSky Post

on:
  schedule:
    - cron: '0 16 * * *'  # ⏰ Triggers at 18:00 CET/CEST (UTC+2)
  workflow_dispatch:       # Allow manual triggering via GitHub UI

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Debug OpenAI connectivity
        run: |
          echo "Resolving api.openai.com…"
          nslookup api.openai.com || true

          echo "Pinging api.openai.com…"
          ping -c 2 api.openai.com || true

          echo "Curling models endpoint…"
          curl -v https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY" || true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}


