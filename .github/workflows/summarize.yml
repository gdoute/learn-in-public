name: Daily Summary and BlueSky Post

on:
  schedule:
    - cron: '0 16 * * *'  # ⏰ Triggers at 18:00 CET/CEST (UTC+2)
  workflow_dispatch:       # Allow manual triggering via GitHub UI

jobs:
  summarize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install openai atproto

      - name: Generate summary and post to BlueSky
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python summarize.py

      - name: Push marker commit (if any)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git push
